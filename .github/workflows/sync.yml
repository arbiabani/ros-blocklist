name: Sync MikroTik Blocklist L

on:
  schedule:
    # اجرا به صورت خودکار هر 24 ساعت یک‌بار (ساعت 3 بامداد UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # امکان اجرای دستی با یک کلیک

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove old blocklist file
        run: |
          rm -f blocklist_l.json

      - name: Download blocklist_l.json from GitLab
        run: |
          curl -sS -f -O https://multiduplikator-group.gitlab.io/mikrotik_blocklist/blocklist_l.json

      - name: Commit and Push updated list
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blocklist_l.json
          git diff --staged --quiet || (git commit -m "Auto-update blocklist_l.json" && git push)
