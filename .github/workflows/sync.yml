name: Sync MikroTik Blocklists

on:
  schedule:
    # اجرا به صورت خودکار در دقیقه 15 هر 2 ساعت یک‌بار
    - cron: '15 */2 * * *'
  workflow_dispatch: # امکان اجرای دستی با یک کلیک

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JSON lists from GitLab
        run: |
          curl -sS -f -O https://multiduplikator-group.gitlab.io/mikrotik_blocklist/blocklist.json
          curl -sS -f -O https://multiduplikator-group.gitlab.io/mikrotik_blocklist/blocklist_l.json
          curl -sS -f -O https://multiduplikator-group.gitlab.io/mikrotik_blocklist/blocklist_xl.json

      - name: Commit and Push updated lists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --staged --quiet || (git commit -m "Auto-update blocklists" && git push)
